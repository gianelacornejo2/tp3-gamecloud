<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>GameCloud Ranking</title>
  <script src="config.js"></script>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 40px; display: flex; justify-content: center; }
    .box { max-width: 800px; width: 100%; background: #1e293b; border-radius: 10px; padding: 25px; }
    h1 { margin: 0 0 5px; font-size: 26px; }
    p.sub { color: #94a3b8; margin: 0 0 20px; font-size: 14px; }
    .grid { display: flex; gap: 20px; margin-bottom: 20px; }
    .card { flex: 1; background: #0f172a; border-radius: 8px; padding: 15px; border: 1px solid #334155; }
    .card h2 { margin: 0 0 10px; font-size: 18px; color: #f59e0b; }
    .form { background: #0f172a; border-radius: 8px; padding: 20px; border: 1px solid #334155; }
    .form h3 { margin: 0 0 15px; color: #f59e0b; }
    .row { display: flex; gap: 10px; }
    input, select { background: #1e293b; border: 1px solid #334155; color: #fff; padding: 8px 12px; border-radius: 6px; }
    input[type="text"] { flex: 1; }
    button { background: #f59e0b; border: none; font-weight: bold; padding: 8px 18px; border-radius: 6px; cursor: pointer; }
    .err { color: #ef4444; margin-top: 10px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>GameCloud Ranking</h1>
    <p class="sub">Frontend en S3 · API Gateway + Lambda · SQS · DynamoDB</p>
    <div class="grid">
      <div class="card"><h2>Doom</h2><div id="doom">Cargando...</div></div>
      <div class="card"><h2>Pac-Man</h2><div id="pacman">Cargando...</div></div>
    </div>
    <div class="form">
      <h3>Cargar un puntaje</h3>
      <div class="row">
        <input type="text" id="jugador" placeholder="Jugador">
        <select id="juego"><option value="doom">Doom</option><option value="pacman">Pac-Man</option></select>
        <input type="number" id="puntaje" placeholder="Puntaje">
        <button onclick="enviarPuntaje()">Enviar</button>
      </div>
      <div id="msg" class="err"></div>
    </div>
  </div>
  <script>
    const API = window.GAMECLOUD_API || "";
    async function cargarRanking() {
      if (!API) { document.getElementById('msg').innerText = 'No se pudo consultar la API'; return; }
      try {
        const rD = await fetch(`${API}/ranking?juego=doom`);
        const doom = await rD.json();
        document.getElementById('doom').innerHTML = `<ol>${doom.map(p => `<li>${p.jugador}:${p.puntaje}</li>`).join('')}</ol>`;
        const rP = await fetch(`${API}/ranking?juego=pacman`);
        const pacman = await rP.json();
        document.getElementById('pacman').innerHTML = `<ol>${pacman.map(p => `<li>${p.jugador}:${p.puntaje}</li>`).join('')}</ol>`;
      } catch (e) {
        document.getElementById('msg').innerText = 'No se pudo consultar la API';
      }
    }
    async function enviarPuntaje() {
      const jugador = document.getElementById('jugador').value;
      const juego = document.getElementById('juego').value;
      const puntaje = parseInt(document.getElementById('puntaje').value);
      if (!jugador || isNaN(puntaje)) return;
      try {
        const res = await fetch(`${API}/scores`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ jugador, juego, puntaje })
        });
        if (res.status === 202) { alert('Puntaje enviado'); setTimeout(cargarRanking, 1000); }
        else { alert('Error al enviar puntaje'); }
      } catch (e) { alert('Error conectando a la API'); }
    }
    window.onload = cargarRanking;
  </script>
</body>
</html>
